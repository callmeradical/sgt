[tools]
# Sgt supports Bash 3.2+ and uses Python 3 for bounded JSON/state handling.

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tasks.install]
description = "Symlink wiki-daily-digest into ~/.local/bin and build the sgt binary"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO_DIR="$(cd "$(dirname "$MISE_ORIGINAL_CWD")" && pwd)/$(basename "$MISE_ORIGINAL_CWD")"
# Resolve to actual repo root regardless of where mise is invoked from
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
BIN_DIR="$REPO_DIR/bin"
TARGET_DIR="${SGT_INSTALL_DIR:-$HOME/.local/bin}"

mkdir -p "$TARGET_DIR"

linked=0
for f in "$BIN_DIR/wiki-daily-digest"; do
  [[ -f "$f" ]] || continue
  name="$(basename "$f")"
  ln -sf "$f" "$TARGET_DIR/$name"
  echo "  linked: $TARGET_DIR/$name -> $f"
  linked=$((linked+1))
done

# Remove legacy oc-inject links that may still exist from earlier Sgt
# checkouts. oc-inject was deleted in August 2026 (GH #179). The file no
# longer ships in bin/ so any remaining symlinks are stale.
for deprecated_link in "$TARGET_DIR/oc-inject" "$HOME/.config/opencode/plugins/oc-inject.js"; do
  [[ -L "$deprecated_link" ]] || continue
  rm "$deprecated_link"
  echo "  removed stale oc-inject link: $deprecated_link"
done

echo ""
echo "Installed $linked scripts to $TARGET_DIR"

# Build the Go engine/MCP binary if Go is available
if command -v go &>/dev/null; then
  echo ""
  echo "Building sgt (native v2 engine + MCP)..."
  (cd "$REPO_DIR" && go build -ldflags="-s -w" -o bin/sgt ./cmd/sgt/) && \
    echo "  built: $REPO_DIR/bin/sgt" || \
    echo "  WARNING: go build failed — sgt not available"
else
  echo ""
  echo "NOTE: go not found — skipping sgt build. Install Go 1.21+ and run 'mise run build'."
fi

# Check PATH
if ! echo "$PATH" | tr ':' '\\n' | grep -qxF "$TARGET_DIR"; then
  echo ""
  echo "WARNING: $TARGET_DIR is not on your PATH."
  echo "Add this to your shell config (~/.zshrc or ~/.bashrc):"
  echo "  export PATH=\"$TARGET_DIR:\\$PATH\""
fi

# Install git hooks from scripts/hooks/ into .git/hooks/
hooks_src="$REPO_DIR/scripts/hooks"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
if [[ -d "$hooks_src" && -d "$hooks_dst" ]]; then
  for hook in "$hooks_src"/*; do
    [[ -f "$hook" ]] || continue
    name="$(basename "$hook")"
    ln -sf "$hook" "$hooks_dst/$name"
    echo "  linked hook: $hooks_dst/$name -> $hook"
  done
fi
"""

[tasks."install:hooks"]
description = "Symlink scripts/hooks/* into .git/hooks/ (runs automatically via mise run install)"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
hooks_src="$REPO_DIR/scripts/hooks"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
[[ -d "$hooks_src" && -d "$hooks_dst" ]] || { echo "hooks dirs not found"; exit 1; }
linked=0
for hook in "$hooks_src"/*; do
  [[ -f "$hook" ]] || continue
  name="$(basename "$hook")"
  ln -sf "$hook" "$hooks_dst/$name"
  echo "  linked: $hooks_dst/$name -> $hook"
  linked=$((linked+1))
done
echo "Installed $linked git hooks."
"""

[tasks."uninstall:hooks"]
description = "Remove git hooks installed from scripts/hooks/"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel 2>/dev/null || echo "${MISE_PROJECT_ROOT:-.}")"
hooks_dst="$(git -C "$REPO_DIR" rev-parse --git-dir 2>/dev/null)/hooks"
hooks_src="$REPO_DIR/scripts/hooks"
removed=0
for hook in "$hooks_src"/*; do
  [[ -f "$hook" ]] || continue
  name="$(basename "$hook")"
  link="$hooks_dst/$name"
  [[ -L "$link" ]] || continue
  target="$(readlink "$link")"
  [[ "$target" == "$hook" ]] || continue
  rm "$link"
  echo "  removed: $link"
  removed=$((removed+1))
done
echo "Removed $removed git hooks."
"""

[tasks.uninstall]
description = "Remove Sgt symlinks from ~/.local/bin"
run = """
#!/usr/bin/env bash
set -euo pipefail

TARGET_DIR="${SGT_INSTALL_DIR:-$HOME/.local/bin}"
removed=0

for f in "$TARGET_DIR/wiki-daily-digest"; do
  [[ -L "$f" ]] || continue
  # Only remove if it points back into the sgt repo
  target="$(readlink "$f")"
  if [[ "$target" == *"/sgt/bin/"* ]]; then
    rm "$f"
    echo "  removed: $f"
    removed=$((removed+1))
  fi
done

echo ""
echo "Removed $removed symlinks from $TARGET_DIR"
"""

[tasks.check]
description = "Verify the prerequisites the v2 Go engine actually uses"
run = """
#!/usr/bin/env bash
# Everything below is derived from exec.Command call sites in internal/ and
# cmd/sgt/. tmux is forbidden as a factory dependency (D7) and is not
# checked for here.
ok=true

_need() {
  local name="$1" cmd="$2" why="$3"
  if command -v "$cmd" &>/dev/null; then
    printf "  %-10s  ok   %s\\n" "$name" "$why"
  else
    printf "  %-10s  MISSING  %s\\n" "$name" "$why"
    ok=false
  fi
}

echo "v2 engine prerequisites:"
_need git      git      "worktrees, branches, commits"
_need bash     bash     "runs each configured quality gate"
_need openspec openspec "dispatch resolves to a change (O3)"
_need gh       gh       "opening a pull request"

# claude is the default harness: a project that sets no defaults.agent runs
# it, so it is looked for first.
harness=""
for h in claude opencode oc goose codex pi copilot; do
  if command -v "$h" &>/dev/null; then harness="$h"; break; fi
done
if [[ "$harness" == claude ]]; then
  printf "  %-10s  ok   %s\\n" "agent" "claude (the default harness)"
elif [[ -n "$harness" ]]; then
  printf "  %-10s  ok   %s\\n" "agent" "$harness"
  printf "  %-10s  note %s\\n" "" "claude is the default harness and is not on PATH; set defaults.agent in each project, or install claude"
else
  printf "  %-10s  MISSING  %s\\n" "agent" "one of: claude opencode oc goose codex pi copilot"
  ok=false
fi

# Gauntlet roles are on by default for claude, and a dispatch is refused when
# claude reports no usable gauntlet plugin. That is a per-project choice
# (defaults.gauntlet_roles: false opts out), so a problem here only warns. A
# plugin counts when it mirrors the dispatch preflight: id gauntlet@*,
# enabled, user or managed scope, with agents/alpha.md and agents/beta.md.
# Reading the JSON needs python3; without it the check warns instead.
_gauntlet_warn() {
  printf "  %-10s  WARNING  %s\\n" "gauntlet" "$1"
  printf "  %-10s           %s\\n" "" "projects with gauntlet roles on (the claude default) are refused at dispatch;"
  printf "  %-10s           %s\\n" "" "install: /plugin install gauntlet@gauntlet, or set defaults.gauntlet_roles: false"
}
if [[ "$harness" == claude ]]; then
  if ! command -v python3 &>/dev/null; then
    _gauntlet_warn "could not check claude's plugin list: python3 not found"
  elif ! plugin_json="$(claude plugin list --json 2>/dev/null)"; then
    _gauntlet_warn "could not read claude's plugin list (claude plugin list --json failed)"
  else
    gauntlet="$(printf '%s' "$plugin_json" | python3 -I -c '
import json, os, sys
try:
    entries = json.load(sys.stdin)
except Exception:
    entries = None
if not isinstance(entries, list):
    print("unreadable")
    sys.exit(0)
for e in entries:
    if not isinstance(e, dict):
        continue
    if not str(e.get("id", "")).startswith("gauntlet@") or e.get("enabled") is not True:
        continue
    if e.get("scope") not in ("user", "managed"):
        continue
    path = e.get("installPath") or ""
    if path and all(os.path.isfile(os.path.join(path, "agents", r)) for r in ("alpha.md", "beta.md")):
        print("ok " + str(e.get("version", "")))
        sys.exit(0)
print("none")
')"
    case "$gauntlet" in
      "ok "*)
        printf "  %-10s  ok   %s\\n" "gauntlet" "plugin ${gauntlet#ok } (gauntlet:alpha builds, gauntlet:beta reviews)" ;;
      none)
        _gauntlet_warn "claude reports no enabled gauntlet plugin with both roles at user or managed scope" ;;
      *)
        _gauntlet_warn "could not read claude's plugin list (output is not a JSON plugin list)" ;;
    esac
  fi
fi

if [[ "$ok" == true ]]; then
  echo ""
  echo "All v2 prerequisites present."
else
  echo ""
  echo "Install the missing prerequisites before dispatching."
  exit 1
fi
"""

[tasks."spec-status"]
description = "Cross-reference docs/prd-*.md against openspec/changes/ (active and archived): what's implemented, what's implemented but not archived, and what has no OpenSpec change yet"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
"$REPO_DIR/scripts/spec-status.sh" --repo-root "$REPO_DIR"
"""

[tasks.update]
description = "Pull latest changes from origin and reinstall symlinks"
run = """
#!/usr/bin/env bash
set -euo pipefail

REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
echo "Pulling latest sgt ..."
git -C "$REPO_DIR" pull --ff-only
echo ""
echo "Reinstalling ..."
mise run install
"""

[tasks.build]
description = "Build the sgt Go binary for the current OS/arch"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
cd "$REPO_DIR"
if ! command -v go &>/dev/null; then
  echo "ERROR: go not found. Install Go 1.21+ to build sgt."
  exit 1
fi
echo "Building sgt (native v2 engine + MCP)..."
go build -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" \
  -o bin/sgt ./cmd/sgt/
echo "Built: bin/sgt"
"""

[tasks."build:all"]
description = "Cross-compile sgt for all supported platforms (darwin/linux x amd64/arm64)"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
cd "$REPO_DIR"
if ! command -v go &>/dev/null; then
  echo "ERROR: go not found. Install Go 1.21+ to build sgt."
  exit 1
fi
VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
LDFLAGS="-s -w -X main.version=$VERSION"
mkdir -p dist/

targets=(
  "darwin/amd64"
  "darwin/arm64"
  "linux/amd64"
  "linux/arm64"
)

for target in "${targets[@]}"; do
  os="${target%/*}"
  arch="${target#*/}"
  out="dist/sgt-${os}-${arch}"
  echo "Building $out..."
  GOOS="$os" GOARCH="$arch" go build -ldflags="$LDFLAGS" -o "$out" ./cmd/sgt/
done

echo ""
echo "Built:"
ls -lh dist/sgt-*
"""

[tasks."build:clean"]
description = "Remove built binaries (bin/sgt and dist/)"
run = """
#!/usr/bin/env bash
set -euo pipefail
REPO_DIR="$(git -C "${MISE_PROJECT_ROOT:-.}" rev-parse --show-toplevel)"
rm -f "$REPO_DIR/bin/sgt"
rm -rf "$REPO_DIR/dist/"
echo "Cleaned."
"""
